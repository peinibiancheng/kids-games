<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<title>小羊的快乐小游戏</title>
<style>
/* 单文件、零依赖：所有美术由 Canvas 程序化绘制，所有音效由 WebAudio 合成 */
:root{--sky:#8fd8ff;--ink:#4b3a3c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);
  font-family:'Yuanti SC','幼圆','Microsoft YaHei','PingFang SC',sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
#fatal{position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;display:none;
  padding:10px 12px;border-radius:12px;background:#fff0f0;color:#a32323;font:13px/1.5 monospace;
  white-space:pre-wrap;z-index:9}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="fatal"></div>
<script>
'use strict';
/* =========================================================================
   0. 引擎：逻辑分辨率 1280x720，等比缩放 + 居中留边；键鼠/触屏统一为 tap
   ========================================================================= */
const VW = 1280, VH = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
let scale = 1, offX = 0, offY = 0, DPR = 1;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  DPR = dpr;
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2; offY = (h - VH * scale) / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#8fd8ff'; ctx.fillRect(0, 0, w, h);
}
window.addEventListener('resize', resize);

let t = 0;
const P = { x: VW/2, y: VH/2, down:false, pressed:false, released:false };
function toLogical(cx, cy){
  const r = canvas.getBoundingClientRect();
  P.x = (cx - r.left - offX) / scale;
  P.y = (cy - r.top  - offY) / scale;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); toLogical(e.clientX, e.clientY);
  P.down = true; P.pressed = true; canvas.focus(); ensureAudio();
});
canvas.addEventListener('pointermove', e => { toLogical(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => { P.down = false; P.released = true; });
window.addEventListener('pointercancel', () => { P.down = false; });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp'){
    e.preventDefault(); P.x = VW/2; P.y = VH/2;
    P.down = true; P.pressed = true; ensureAudio();
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') P.down = false; });

let audioCtx = null, soundOn = localStorage.getItem('peppa_sound') !== '0';
function ensureAudio(){
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { soundOn = false; }
}
function tone(freq, dur, type, vol, delay){
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function sfx(name){
  if (name === 'tap')   tone(660, .09, 'sine', .05);
  if (name === 'pop')   { tone(520, .08, 'triangle', .07); tone(780, .12, 'sine', .05, .06); }
  if (name === 'yay')   [523,659,784,1047].forEach((f,i)=>tone(f,.24,'sine',.07,i*.09));
  if (name === 'woo')   { tone(300,.25,'sine',.06); tone(600,.3,'sine',.05,.1); }
  if (name === 'splash'){ tone(220,.16,'triangle',.07); tone(170,.2,'sine',.05,.08); }
  if (name === 'boing') { tone(180,.18,'sine',.08); tone(420,.2,'triangle',.05,.09); }
  if (name === 'star')  [880,1109,1319].forEach((f,i)=>tone(f,.16,'sine',.06,i*.07));
}
function toggleSound(){
  soundOn = !soundOn; localStorage.setItem('peppa_sound', soundOn ? '1' : '0');
  if (soundOn) { ensureAudio(); sfx('pop'); }
}

/* ---------- 绘图基元 ---------- */
const LINE = '#5b3a3c', LW = 5;
function fillStroke(fill, stroke, lw){
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke !== null){ ctx.strokeStyle = stroke || LINE; ctx.lineWidth = lw || LW; ctx.stroke(); }
}
function rr(x,y,w,h,r,fill,stroke,lw){
  r = Math.min(r, w/2, h/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  fillStroke(fill, stroke === undefined ? LINE : stroke, lw);
}
function ell(x,y,rx,ry,fill,stroke,lw,rot){
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);
  fillStroke(fill, stroke === undefined ? LINE : stroke, lw);
}
function poly(pts,fill,stroke,lw){
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath(); fillStroke(fill, stroke === undefined ? LINE : stroke, lw);
}
function line(x1,y1,x2,y2,color,lw){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle = color || LINE; ctx.lineWidth = lw || 5; ctx.lineCap = 'round'; ctx.stroke();
}
function text(s,x,y,size,color,align,weight){
  ctx.font = (weight||800)+' '+size+"px 'Yuanti SC','幼圆','Microsoft YaHei',sans-serif";
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color || LINE; ctx.fillText(s,x,y);
}
function textOut(s,x,y,size,fill,stroke,align,lw){
  ctx.font = "900 "+size+"px 'Yuanti SC','幼圆','Microsoft YaHei',sans-serif";
  ctx.textAlign = align||'center'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=lw||10; ctx.strokeStyle=stroke||'#fff'; ctx.strokeText(s,x,y);
  ctx.fillStyle=fill; ctx.fillText(s,x,y);
}
function star(x,y,r,fill,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.beginPath();
  for(let i=0;i<10;i++){
    const a = -Math.PI/2 + i*Math.PI/5, rr2 = i%2 ? r*0.45 : r;
    const px = Math.cos(a)*rr2, py = Math.sin(a)*rr2;
    i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.closePath(); fillStroke(fill||'#ffd447', LINE, 3); ctx.restore();
}
function inRect(r){ return P.pressed && P.x>=r.x && P.x<=r.x+r.w && P.y>=r.y && P.y<=r.y+r.h; }
function button(x,y,w,h,label,color,size){
  const r = {x,y,w,h}, hot = P.x>=x&&P.x<=x+w&&P.y>=y&&P.y<=y+h;
  const lift = hot ? 3 : 0;
  rr(x,y+6,w,h,Math.min(h/2,26),'rgba(75,58,60,.22)',null);
  rr(x,y-lift,w,h,Math.min(h/2,26),color||'#ffcf40',LINE,5);
  rr(x+8,y+7-lift,w-16,h-18,Math.min(h/2,20),'rgba(255,255,255,.28)',null);
  text(label,x+w/2,y+h/2-lift,size||Math.min(30,h*.44),'#fff','center',900);
  return inRect(r);
}

/* ---------- 场景素材 ---------- */
function cloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ell(-34,4,30,20,'#fff',null); ell(0,-10,36,26,'#fff',null);
  ell(34,4,30,20,'#fff',null); rr(-56,2,112,20,10,'#fff',null); ctx.restore();
}
function sun(x,y,r){
  for(let i=0;i<12;i++){ const a=i*Math.PI/6+t*.12; line(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*1.3,x+Math.cos(a)*r*1.65,y+Math.sin(a)*r*1.65,'#ffe488',6); }
  ell(x,y,r,r,'#ffd94a',null); ell(x-8,y-8,r*.45,r*.45,'#ffe98a',null);
}
function hill(x,y,w,h,c){ ctx.beginPath(); ctx.ellipse(x,y,w,h,0,Math.PI,Math.PI*2); ctx.closePath(); fillStroke(c,null); }
function tree(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  rr(-9,-52,18,54,7,'#a46b45',LINE,4);
  ell(-26,-76,34,34,'#5fbf57',LINE,4); ell(26,-78,34,34,'#69c95e',LINE,4);
  ell(0,-104,40,38,'#74d268',LINE,4); ctx.restore();
}
function bush(x,y,s,c){ ell(x,y,36*s,22*s,c||'#62c255',LINE,4); ell(x+26*s,y+5*s,24*s,17*s,c||'#62c255',LINE,4); }
function flower(x,y,c){ line(x,y,x,y-20,'#4fae46',3); ell(x,y-24,7,7,c||'#ff7f9e',null); ell(x,y-24,3,3,'#ffe66b',null); }
function fence(x,y,w){
  for(let i=0;i<=w/70;i++){ rr(x+i*70,y,12,52,4,'#fff8e6',LINE,3); }
  line(x,y+14,x+w,y+14,'#fff8e6',7); line(x,y+36,x+w,y+36,'#fff8e6',7);
}
function house(x,y,s,roof){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  rr(-72,-100,144,102,8,'#fff7e6',LINE,5);
  poly([-88,-100,0,-172,88,-100],roof||'#e9546d',LINE,6);
  rr(-20,-62,40,64,6,'#9ad9f4',LINE,4); line(0,-62,0,2,'#fff',4);
  rr(34,-84,24,30,5,'#bdeaff',LINE,4);
  rr(-60,-146,30,28,6,'#ffd95e',LINE,4);
  ctx.restore();
}
function sky(color){
  ctx.fillStyle=color||'#8fd8ff'; ctx.fillRect(0,0,VW,VH);
  sun(1110,100,48);
  cloud(170+Math.sin(t*.22)*14,95,1); cloud(520+Math.sin(t*.17)*10,70,.75); cloud(830+Math.sin(t*.25)*12,130,.9);
}
function meadow(){
  hill(190,540,330,170,'#b9e878'); hill(620,555,380,150,'#aee16e'); hill(1090,545,340,160,'#bce986');
  ctx.fillStyle='#83d45f'; ctx.fillRect(0,540,VW,VH-540);
  ctx.fillStyle='#77ca54'; ctx.fillRect(0,590,VW,VH-590);
  for(let i=0;i<18;i++){ const x=40+i*74+(i%3)*12; line(x,620+((i*37)%60),x+9,610+((i*37)%60),'#66b846',3); }
  bush(80,548,.8); bush(1200,552,.9,'#5cbd53');
  for(let i=0;i<7;i++) flower(120+i*170,560+(i%2)*22, i%2?'#ff7f9e':'#ffd447');
}

/* ---------- 小羊角色（程序化，蓬松羊毛 + 奶油色脸） ---------- */
function pig(x,y,s,o){
  o = o || {};
  const face=o.body||'#f0d9c4', wool='#fffdf6', dress=o.dress||'#f3425c', pose=o.pose||'idle';
  const lean = pose==='pull' ? -.16 : 0;
  ctx.save(); ctx.translate(x,y+Math.sin(t*3.6+(o.phase||0))*(o.still?0:3));
  ctx.scale(s*(o.dir||1),s); ctx.rotate(lean);
  // 腿
  rr(-24,-48,19,50,8,face,LINE,4); rr(5,-48,19,50,8,face,LINE,4);
  ell(-15,-2,13,7,face,LINE,3); ell(15,-2,13,7,face,LINE,3);
  // 蓬松身体
  ell(-27,-94,25,24,wool,LINE,4); ell(25,-94,25,24,wool,LINE,4);
  ell(0,-108,29,27,wool,LINE,4); ell(-12,-74,22,20,wool,LINE,4); ell(16,-74,22,20,wool,LINE,4);
  if (dress){
    ctx.beginPath(); ctx.moveTo(-34,-96); ctx.quadraticCurveTo(0,-110,34,-96);
    ctx.lineTo(42,-50); ctx.quadraticCurveTo(0,-36,-42,-50); ctx.closePath();
    fillStroke(dress,LINE,5);
    line(-36,-56,36,-56,'#fff6f8',5);
  }
  // 手臂
  if (pose==='cheer'){
    line(-28,-112,-52,-160,face,15); line(28,-112,52,-160,face,15);
    ell(-53,-163,10,10,face,LINE,3); ell(53,-163,10,10,face,LINE,3);
  } else if (pose==='pull'){
    line(-28,-108,26,-128,face,15); line(28,-108,52,-120,face,15);
    ell(28,-128,10,10,face,LINE,3); ell(54,-120,10,10,face,LINE,3);
  } else if (pose==='skate'){
    line(-28,-108,-64,-124,face,15); line(28,-108,60,-96,face,15);
    ell(-66,-125,10,10,face,LINE,3); ell(62,-96,10,10,face,LINE,3);
  } else {
    line(-28,-108,-44,-80,face,15); line(28,-108,46,-82,face,15);
    ell(-45,-78,10,10,face,LINE,3); ell(47,-80,10,10,face,LINE,3);
  }
  // 蓬松头 + 耷拉耳朵
  ell(-19,-160,23,22,wool,LINE,4); ell(4,-170,25,23,wool,LINE,4);
  ell(23,-157,20,19,wool,LINE,4); ell(-12,-137,18,17,wool,LINE,4);
  ell(-18,-178,17,9,face,LINE,3); ell(-19,-178,8,4.5,'#ffb3c6',null);
  // 脸、口鼻
  ell(17,-145,31,27,face,LINE,5);
  ell(44,-139,15,12,'#f3c7bb',LINE,3);
  ell(51,-143,3.5,4.5,'#b98484',null); ell(51,-135,3.5,4.5,'#b98484',null);
  ell(21,-136,10,7,'#ffb3c6',null);
  // 眼睛
  ell(8,-158,9,11,'#fff',LINE,3); ell(29,-158,8,10,'#fff',LINE,3);
  ell(11,-157,4,5,'#3c3034',null); ell(31,-157,4,5,'#3c3034',null);
  // 微笑
  ctx.beginPath(); ctx.arc(30,-127,10,0.15,Math.PI-0.15); ctx.strokeStyle=LINE; ctx.lineWidth=3.5; ctx.stroke();
  if (o.glasses){
    ell(8,-158,18,18,null,LINE,3); ell(29,-158,17,17,null,LINE,3); line(19,-158,20,-158,LINE,3);
  }
  if (o.lashes){
    line(0,-169,-6,-177,LINE,3); line(8,-171,7,-180,LINE,3); line(15,-169,20,-177,LINE,3);
  }
  ctx.restore();
}
const PEPPA  = { body:'#f0d9c4', dress:'#ee3d57' };
const GEORGE = { body:'#f0d9c4', dress:'#4e9ce8' };
const MUMMY  = { body:'#f0d9c4', dress:'#f2a13c', lashes:true };
const DADDY  = { body:'#f0d9c4', dress:'#4f8fc9', glasses:true };

/* ---------- 粒子 ---------- */
let parts = [];
function burst(x,y,color,n,spd){
  for(let i=0;i<(n||12);i++){
    const a=Math.random()*Math.PI*2, v=(spd||180)*(.4+Math.random()*.8);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:.6+Math.random()*.5,
      c:color||'#ffd447',r:4+Math.random()*6});
  }
}
function updateParts(dt){
  parts.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt; p.life-=dt; });
  parts=parts.filter(p=>p.life>0);
}
function drawParts(){
  parts.forEach(p=>{ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2)); ell(p.x,p.y,p.r,p.r,p.c,null); });
  ctx.globalAlpha=1;
}

/* ---------- 存档与场景切换 ---------- */
let best = {};
try { best = JSON.parse(localStorage.getItem('peppa_best') || '{}') || {}; } catch(e){ best = {}; }
function saveBest(id,n){ if((best[id]||0)<n){ best[id]=n; localStorage.setItem('peppa_best',JSON.stringify(best)); } }
const GAMES = [
  {id:'fish', name:'快乐钓鱼', color:'#52b6e8', icon:'fish'},
  {id:'tug',  name:'大力拔河', color:'#f39a3d', icon:'rope'},
  {id:'slide',name:'滑滑梯',   color:'#ee5b85', icon:'slide'},
  {id:'skate',name:'溜冰场',   color:'#8c7bea', icon:'skate'},
  {id:'mush', name:'采蘑菇',   color:'#e7654f', icon:'mush'}
];
let scene='title', flash=0;
function go(s){
  if(s==='fish') fishReset();
  if(s==='tug') tugReset();
  if(s==='slide') slideReset();
  if(s==='skate') skateReset();
  if(s==='mush') mushReset();
  scene=s; flash=1; P.pressed=false;
}
let resultGame='fish', resultStars=0, resultCount=0;
function finish(id,star,count){
  resultGame=id; resultStars=star; resultCount=count; saveBest(id,star); sfx('yay'); go('result');
}

/* ---------- 通用顶部栏 ---------- */
function topBar(title,back){
  rr(16,14,VW-32,64,30,'rgba(255,255,255,.92)',LINE,5);
  if(back && button(30,22,74,48,'←','#ffb43f',30)) { sfx('tap'); go('hub'); }
  text(title, back? VW/2+35 : VW/2, 46, 32, LINE,'center',900);
  star(VW-232,46,22,'#ffd447'); text('× '+(GAMES.reduce((a,g)=>a+(best[g.id]||0),0)),VW-208,47,26,LINE,'left',900);
  const sr={x:VW-110,y:22,w:80,h:48};
  rr(sr.x,sr.y,sr.w,sr.h,22,soundOn?'#ffe27a':'#e5e5e5',LINE,4);
  text(soundOn?'声音 开':'声音 关',sr.x+40,sr.y+24,20,LINE);
  if(inRect(sr)) toggleSound();
}

/* ---------- 标题页 ---------- */
function drawTitle(){
  sky(); meadow();
  house(250,510,1.15,'#e9546d'); house(1030,520,.95,'#5fb9e8');
  tree(128,530,1.05); tree(1170,535,1.1);
  fence(470,505,330);
  pig(560,650,1.05,PEPPA); pig(690,650,.82,GEORGE);
  rr(VW/2-310,118,620,208,36,'rgba(255,255,255,.92)',LINE,7);
  textOut('小羊的快乐小游戏',VW/2,185,62,'#f3425c','#fff',undefined,12);
  text('钓鱼 · 拔河 · 滑滑梯 · 溜冰 · 采蘑菇',VW/2,255,29,LINE);
  text('和小羊一起玩吧！',VW/2,297,23,'#7a6264');
  if(button(VW/2-150,352,300,80,'开始玩  →','#ff8f43',34)){ sfx('yay'); go('hub'); }
  text('点一下屏幕就能玩，也可以用空格键',VW/2,694,22,'#fff','center',700);
}

/* ---------- 游戏中心 ---------- */
function icon(kind,x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if(kind==='fish'){ line(-34,10,20,-22,'#7a4a3c',6); line(20,-22,34,-42,'#7a4a3c',5);
    ell(12,-16,15,9,'#5ec9f2',LINE,3); poly([[27,-16],[39,-24],[39,-8]],'#5ec9f2',LINE,3); ell(-2,18,30,15,'#63c8f0',LINE,4); }
  if(kind==='rope'){ line(-42,12,42,-12,'#c98758',9); ctx.setLineDash([6,8]); line(-42,12,42,-12,'#fff3d0',4); ctx.setLineDash([]);
    rr(-4,-8,9,20,3,'#f3425c',LINE,3); }
  if(kind==='slide'){ line(-40,-34,-40,22,'#8a5b45',9); line(-40,-34,34,-34,'#8a5b45',9);
    line(-32,-26,40,22,'#5fb9e8',20); line(-32,-26,40,22,'#e9f8ff',5); }
  if(kind==='skate'){ ell(-18,14,10,7,'#fff',LINE,3); ell(18,20,10,7,'#fff',LINE,3);
    line(-18,10,-10,-2,'#6a8ec9',7); line(16,16,8,0,'#6a8ec9',7); ell(0,-10,20,22,'#ffb3d1',LINE,4); }
  if(kind==='mush'){ rr(-7,0,14,22,5,'#fff5e0',LINE,3); ell(0,-2,28,18,'#e75b52',LINE,4);
    ell(-12,-7,5,5,'#fff',null); ell(9,-10,6,5,'#fff',null); }
  ctx.restore();
}
function drawHub(){
  sky(); meadow();
  textOut('今天玩什么？',VW/2,92,52,'#fff','#4b3a3c',undefined,10);
  const sr={x:VW-104,y:22,w:76,h:52};
  rr(sr.x,sr.y,sr.w,sr.h,24,soundOn?'#ffe27a':'#e5e5e5',LINE,4); text(soundOn?'声音':'静音',sr.x+38,sr.y+26,20,LINE);
  if(inRect(sr)) toggleSound();
  star(VW-340,48,20,'#ffd447'); text('× '+(GAMES.reduce((a,g)=>a+(best[g.id]||0),0)),VW-318,49,24,'#fff','left',900);
  for(let i=0;i<GAMES.length;i++){
    const g=GAMES[i], col=i%3, row=Math.floor(i/3);

let M=null;
const MSPOTS=[{x:200,y:580},{x:420,y:624},{x:630,y:566},{x:840,y:628},{x:1060,y:582},{x:740,y:666}];
function mushReset(){ M={time:45,got:0,spawn:0,active:[],last:0}; }
function rushMush(){
  if(M.active.length>=3) return;
  const free=MSPOTS.filter(s=>!M.active.some(a=>a.spot===s));
  if(!free.length) return;
  const spot=free[Math.floor(Math.random()*free.length)];
  M.active.push({spot,life:1.6,age:0,golden:Math.random()<.22,done:false});
}
function updateMush(dt){
  M.time-=dt; M.spawn-=dt;
  if(M.spawn<=0){ rushMush(); M.spawn=.75+Math.random()*.7; }
  M.active.forEach(a=>{ a.life-=dt; a.age+=dt; });
  M.active=M.active.filter(a=>a.life>0);
  if(P.pressed){
    for(let i=M.active.length-1;i>=0;i--){
      const a=M.active[i], s=a.spot;
      if(Math.abs(P.x-s.x)<62 && Math.abs(P.y-(s.y-40))<72 && a.age>.12){
        const v=a.golden?2:1;
        M.got+=v; sfx('star');
        burst(s.x,s.y-45,a.golden?'#ffd447':'#ff8d84',14,170);
        M.active.splice(i,1); break;
      }
    }
  }
  if(M.time<=0) finish('mush',M.got>=12?3:M.got>=7?2:1,M.got);
}

  MSPOTS.forEach(s=>ell(s.x,s.y+9,44,14,'#6bb752',null));
  M.active.forEach(a=>{
    const s=a.spot, grow=Math.min(1,a.age*6)*(a.life<.35?a.life/.35:1);
    drawMushroom(s.x,s.y-8,grow*1.1,a.golden);
    if(a.golden) star(s.x,s.y-92,14,'#ffd447',t*2);
  });
  // 篮子
  ctx.save(); ctx.translate(1140,588);
  poly([[-64,0],[64,0],[48,74],[-48,74]],'#d79a5a',LINE,5);
  line(-44,16,44,16,'#b87b48',5); line(-38,42,38,42,'#b87b48',5);
  ctx.beginPath(); ctx.arc(0,4,64,Math.PI,0); ctx.strokeStyle=LINE; ctx.lineWidth=7; ctx.stroke();
  ctx.restore();
  text('× '+M.got,1140,690,30,'#fff','center',900);
  topBar('采蘑菇',true);
  rr(30,96,420,58,24,'#fffdf5',LINE,5);
  text('点冒出来的蘑菇！金色 +2',240,125,24,LINE);
  rr(30,168,420,20,10,'#e8e4d9',null);
  rr(32,170,416*Math.max(0,M.time/45),16,8,M.time<10?'#f16a5c':'#6ac46a',null);
  drawParts();
}

/* =========================================================================
   6. 调度与主循环
   ========================================================================= */
function globalUI(){
  UI_HIT=false;
  if(scene==='title'||scene==='hub'||scene==='result') return;
  if(!P.pressed) return;
  if(P.x<112 && P.y<86){ UI_HIT=true; sfx('tap'); P.pressed=false; go('hub'); }
  else if(P.x>VW-126 && P.y<86){ UI_HIT=true; toggleSound(); P.pressed=false; }
}
let UI_HIT=false;
function update(dt){
  if(flash>0) flash=Math.max(0,flash-dt*3.2);
  updateParts(dt);
  globalUI();
  if(scene==='fish') updateFish(dt);
  if(scene==='tug') updateTug(dt);
  if(scene==='slide') updateSlide(dt);
  if(scene==='skate') updateSkate(dt);
  if(scene==='mush') updateMush(dt);
}
function render(){
  ctx.setTransform(DPR*scale,0,0,DPR*scale,offX*DPR,offY*DPR);
  ctx.fillStyle='#8fd8ff'; ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  if(scene==='title') drawTitle();
  else if(scene==='hub') drawHub();
  else if(scene==='result') drawResult();
  else if(scene==='fish') drawFishScene();
  else if(scene==='tug') drawTugScene();
  else if(scene==='slide') drawSlideScene();
  else if(scene==='skate') drawSkateScene();
  else if(scene==='mush') drawMushScene();
  if(flash>0){ ctx.globalAlpha=flash*.75; ctx.fillStyle='#fff'; ctx.fillRect(0,0,VW,VH); ctx.globalAlpha=1; }
  ctx.restore();
}
let last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0); last=now; t+=dt;
  try { update(dt); render(); }
  catch(err){
    const f=document.getElementById('fatal');
    f.style.display='block'; f.textContent='出错了：'+(err&&err.stack||err);
    console.error(err);
  }
  P.pressed=false; P.released=false;
  requestAnimationFrame(frame);
}
resize(); fishReset(); tugReset(); slideReset(); skateReset(); mushReset();
requestAnimationFrame(frame);
</script>
