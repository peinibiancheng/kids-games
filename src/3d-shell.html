<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fd8ff">
<title>小羊的快乐小游戏 3D 版</title>
<style>
:root{--ink:#4b3a3c;--pink:#f3425c;--yellow:#ffcf40}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd8ff;
 font-family:'Yuanti SC','幼圆','Microsoft YaHei','PingFang SC',sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app,#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hidden{display:none!important}
button{pointer-events:auto;cursor:pointer;font-family:inherit;border:4px solid var(--ink);
 color:#fff;font-weight:900;text-shadow:0 2px 3px rgba(0,0,0,.25);
 box-shadow:0 6px 0 rgba(75,58,60,.25);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(75,58,60,.25)}
.round{border-radius:999px;padding:12px 28px;font-size:clamp(18px,2.4vw,28px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#screen-title{justify-content:flex-start;padding-top:0}
.card{background:rgba(255,253,245,.95);border:5px solid var(--ink);border-radius:36px;
 padding:16px 38px;text-align:center;box-shadow:0 10px 0 rgba(75,58,60,.2)}
h1{margin:0 0 8px;font-size:clamp(36px,6vw,68px);color:var(--pink);
 -webkit-text-stroke:2px #fff;paint-order:stroke fill}
.sub{margin:0 0 18px;font-size:clamp(16px,2.2vw,26px);color:var(--ink);font-weight:700}
#btn-start{background:#ff8f43;font-size:clamp(22px,3vw,34px);padding:14px 46px}
#screen-result{justify-content:center}
#screen-result .card{padding:32px 56px;min-width:min(90vw,560px)}
#result-title{margin:0 0 10px;font-size:clamp(28px,4vw,44px);color:var(--pink)}
#result-sub{margin:10px 0 22px;font-size:clamp(17px,2.2vw,24px)}
.rs{font-size:clamp(42px,6vw,64px);color:#e3e0da;margin:0 6px;display:inline-block}
.rs.on{color:#ffd447;text-shadow:0 3px 0 #e3a92f}
.row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
#btn-again{background:#6ac46a}#btn-home{background:#ffb43f}
#hud{position:absolute;left:0;right:0;top:0;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#hud .pill{background:rgba(255,253,245,.94);border:4px solid var(--ink);border-radius:999px;
 padding:8px 18px;font-size:clamp(16px,2.1vw,24px);font-weight:900;color:var(--ink)}
#btn-back,#btn-sound{padding:8px 18px;font-size:clamp(16px,2.1vw,22px);background:#ffcf40;color:var(--ink);text-shadow:none;border-width:4px}
#hud-title{background:#fff;border-color:var(--ink)}
#hud-stars{color:#e2a92e}
#hud-extra{background:rgba(255,255,255,.9)}
#prompt{position:absolute;left:0;right:0;bottom:6vh;display:flex;justify-content:center}
#btn-action{background:var(--pink);font-size:clamp(26px,4vw,44px);padding:16px 54px;border-radius:999px;min-width:220px}
.station-label{position:absolute;transform:translate(-50%,-100%);background:rgba(255,253,245,.96);
 border:4px solid var(--ink);border-radius:18px;padding:6px 14px;text-align:center;white-space:nowrap;
 color:var(--ink);box-shadow:0 5px 0 rgba(75,58,60,.2)}
.station-label b{display:block;font-size:clamp(15px,1.8vw,22px)}
.station-label span{display:block;font-size:clamp(13px,1.5vw,18px);color:#e2a92e;letter-spacing:2px}
#fatal{position:fixed;left:8px;right:8px;bottom:8px;max-height:35%;overflow:auto;display:none;
 padding:10px 12px;border-radius:12px;background:#fff0f0;color:#a32323;font:13px/1.5 monospace;
 white-space:pre-wrap;z-index:99;pointer-events:auto}
@media (max-width:640px){#hud{gap:8px;padding:8px}#hud .pill{padding:6px 12px}.card{padding:20px 26px}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="ui">
    <div id="labels"></div>
    <div id="screen-title" class="screen">
      <div class="card">
        <h1>小羊的快乐小游戏</h1>
        <p class="sub">钓鱼 · 拔河 · 滑滑梯 · 溜冰 · 采蘑菇 —— 3D 版</p>
        <button id="btn-start" class="round">开始玩 →</button>
      </div>
    </div>
    <div id="hud" class="hidden">
      <button id="btn-back">← 回家</button>
      <div class="pill" id="hud-title">游戏</div>
      <div class="pill" id="hud-extra"></div>
      <div class="pill" id="hud-stars">× 0</div>
      <button id="btn-sound">声音 开</button>
    </div>
    <div id="prompt" class="hidden"><button id="btn-action">点一下</button></div>
    <div id="screen-result" class="screen hidden">
      <div class="card">
        <h2 id="result-title">完成啦！</h2>
        <div id="result-stars"><span class="rs">★</span><span class="rs">★</span><span class="rs">★</span></div>
        <p id="result-sub"></p>
        <div class="row">
          <button id="btn-again" class="round">再玩一次</button>
          <button id="btn-home" class="round">回到村庄</button>
        </div>
      </div>
    </div>
    <div id="fatal"></div>
  </div>
</div>
<script>/*__THREE__*/</script>
<script>/*__GAME__*/</script>
</body>
</html>
